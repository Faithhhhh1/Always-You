<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Always You</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  display:flex;
  justify-content:center;
  overflow-x:hidden;
  overflow-y:auto;
  color:#fff;
}

/* BACKGROUND */
body::before{
  content:"";
  position:fixed;
  inset:0;
  background:url("bg.jpg") center/cover no-repeat;
  filter:blur(18px);
  transform:scale(1.1);
  z-index:-2;
}
body::after{
  content:"";
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.35);
  z-index:-1;
}

/* STARS */
.star{
  position:fixed;
  width:2px;
  height:2px;
  background:#fff;
  opacity:.3;
  border-radius:50%;
  pointer-events:none;
  animation:twinkle 6s infinite ease-in-out;
}
@keyframes twinkle{
  0%,100%{opacity:.2}
  50%{opacity:.6}
}

/* CONTAINER */
.container{
  max-width:520px;
  padding:25px;
  background:rgba(255,255,255,.15);
  backdrop-filter:blur(6px);
  border-radius:18px;
  text-align:center;
  margin-top:40px;
}

h1{ letter-spacing:2px; }

/* PHOTOS */
.photo{ position:relative; margin-bottom:26px; }
.photo img{
  width:100%;
  border-radius:14px;
  opacity:0;
  transform:translateY(40px);
  transition:opacity 1.3s ease, transform 1.3s ease;
}
.photo.show img{ opacity:1; transform:none; }
.photo.final img{ box-shadow:0 0 40px rgba(255,120,160,.9); }

/* HEART EFFECTS */
.big-heart{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%) scale(.3);
  font-size:65px;
  opacity:0;
  pointer-events:none;
  filter:drop-shadow(0 0 35px rgba(255,90,140,1));
  animation:heartPop 1.2s forwards;
}
@keyframes heartPop{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.3);}
  45%{opacity:1;transform:translate(-50%,-50%) scale(1.4);}
  100%{opacity:0;transform:translate(-50%,-50%) scale(1.8);}
}

.heart-wave{
  position:absolute;
  left:50%;
  top:50%;
  width:40px;
  height:40px;
  border-radius:50%;
  transform:translate(-50%,-50%);
  border:2px solid rgba(255,90,140,.55);
  animation:wave 2.4s ease-out forwards;
  pointer-events:none;
}
@keyframes wave{
  from{opacity:.8;transform:translate(-50%,-50%) scale(.6);}
  to{opacity:0;transform:translate(-50%,-50%) scale(6);}
}

.small-heart{
  position:absolute;
  font-size:18px;
  pointer-events:none;
  filter:drop-shadow(0 0 10px rgba(255,90,140,1));
}

/* AMBIENT HEARTS */
.ambient-heart{
  position:fixed;
  top:-30px;
  font-size:16px;
  pointer-events:none;
  filter:drop-shadow(0 0 10px rgba(255,100,140,1.9));
}

/* ENDING */
.ending{
  margin-top:120px;
  opacity:0;
  transition:opacity 2s ease;
}
.ending.show{opacity:1}
#typedText{white-space:pre-line;font-size:20px;}
#since{margin-top:12px;font-size:14px;opacity:.85;}
#secret{display:none;margin-top:28px;font-size:18px;color:#ffdbe8;}
</style>
</head>

<body>

<div class="container">
<h1>Happy two years together.</h1>
<div id="gallery"></div>

<div class="ending" id="ending">
  <div id="typedText"></div>
  <div id="since"></div>
  <div id="secret">“Thank you for finding me… I’m really glad it was you ❤️”</div>
</div>

<audio id="music" src="song_v2.mp3" preload="auto" loop></audio>
</div>

<script>
/* STARS */
for(let i=0;i<90;i++){
  const s=document.createElement("div");
  s.className="star";
  s.style.left=Math.random()*100+"vw";
  s.style.top=Math.random()*100+"vh";
  s.style.animationDelay=Math.random()*6+"s";
  document.body.appendChild(s);
}

/* CORE LOGIC (UNCHANGED, CLEANED) */
let started=false;
const TOTAL=23;
const SPECIAL=[3,9,14,19,21];
const BPM=72;
const BEAT=60000/BPM;

const gallery=document.getElementById("gallery");
const music=document.getElementById("music");
const ending=document.getElementById("ending");
const typedText=document.getElementById("typedText");
const sinceEl=document.getElementById("since");
const secret=document.getElementById("secret");
const sinceDate=new Date("2023-12-19T22:10:00");

function build(){
  for(let i=1;i<=TOTAL;i++){
    const p=document.createElement("div");
    p.className="photo";
    if(i===TOTAL) p.classList.add("final");
    p.innerHTML=`<img src="image${i}.jpg">`;
    gallery.appendChild(p);
    new IntersectionObserver(e=>{
      if(e[0].isIntersecting) p.classList.add("show");
    },{threshold:.4}).observe(p);
  }
}

function start(){
  if(started) return;
  started=true;
  music.currentTime=38;
  music.volume=0;
  music.play();
  let v=0;
  const fade=setInterval(()=>{
    v+=0.05;
    music.volume=Math.min(v,1);
    if(v>=1) clearInterval(fade);
  },80);
}

document.body.addEventListener("click",start,{once:true});

new IntersectionObserver(e=>{
  if(e[0].isIntersecting){
    ending.classList.add("show");
    typedText.textContent="Two years.\nStill us.\nAlways you.";
  }
},{threshold:.6}).observe(ending);

build();
</script>
</body>
</html>
